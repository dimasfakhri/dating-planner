<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Date Delight Planner 💖</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>✨ Date Delight Planner ✨</h1>
        <p>Rencanakan kencan impianmu (dengan sedikit humor!) 😂</p>
    </header>

    <main class="container">
        
        <section class="input-section">
            <h2>📝 Detail Kencan</h2>
            <div class="form-group">
                <label for="dateName">Nama Kencan:</label>
                <input type="text" id="dateName" placeholder="Contoh: Kencan 'Kopi Tawa' Pertama">
            </div>
            <div class="form-group">
                <label for="dateMood">Pilih Mood Kencan:</label>
                <select id="dateMood">
                    <option value="Santai">🛋️ Santai & Chill</option>
                    <option value="Petualangan">🏞️ Petualangan Ekstrem</option>
                    <option value="Romantis">🌹 Romantis Klasik</option>
                    <option value="Kreatif">🎨 Kreatif & DIY</option>
                    <option value="MakanEnak">🍽️ Makan Enak Sampai Kenyang</option>
                </select>
            </div>
            <div class="form-group">
                <label for="budgetLevel">Level Budget:</label>
                <select id="budgetLevel">
                    <option value="1">💰 Hemat (Di bawah Rp 100k)</option>
                    <option value="2">💸 Sedang (Rp 100k - 500k)</option>
                    <option value="3">💎 Boros (Di atas Rp 500k)</option>
                </select>
            </div>
            
            <button id="generatePlan">🔮 Ramal & Rencanakan! 🚀</button>
        </section>
        
        <section class="result-section hidden">
            <h2>💌 Hasil Ramalan Kencan Anda</h2>
            <div id="dateOutput">
                </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 Date Delight. Dibuat dengan cinta dan sedikit kekonyolan. 😉</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
